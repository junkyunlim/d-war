      const mk=(flip,tint)=>{const c=document.createElement('canvas');c.width=im.width;c.height=im.height;const x=c.getContext('2d');
        if(flip){x.translate(im.width,0);x.scale(-1,1);} x.drawImage(im,0,0);
        if(tint){x.setTransform(1,0,0,1,0,0);x.globalCompositeOperation='source-atop';x.fillStyle=tint;x.fillRect(0,0,c.width,c.height);}
        return c;};
      IMG[id]={hero:mk(false,null), enemy:mk(true,'rgba(220,30,60,0.38)'), hit:mk(false,'rgba(255,255,255,0.5)'), hitE:mk(true,'rgba(255,220,220,0.5)'), w:im.width, h:im.height};

    };

  });

let AC=null;
function beep(f=440,d=0.08,type='square',v=0.05){
  try{ if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;
    g.gain.setValueAtTime(v,AC.currentTime);g.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+d);
    o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d);}catch(e){}
}

/* ===== 업데이트 ===== */
function update(dt){
  S.t+=dt;
  S.money=Math.min(walletMax(S.wallet),S.money+walletRate(S.wallet)*dt);
  S.cd=S.cd.map(c=>Math.max(0,c-dt));
  S.cannon=Math.min(1,S.cannon+dt/40);
  S.shake=Math.max(0,S.shake-dt);

  S.quizT-=dt;
  if(S.quizT<=0){S.quizT=30; if(words().length){QZ=makeQ(); quizFrom='play'; screen='quiz'; say0();}}
  // 적 생산
  S.spawnT-=dt;
  if(S.spawnT<=0){
    const tier=Math.min(ENEMIES.length, 2+Math.floor(S.t/25));
    const d=ENEMIES[Math.floor(Math.random()*tier)];
    spawn(d,-1);
    S.spawnT=S.st.spawn*(0.6+Math.random()*0.8)*Math.max(0.55,1-S.t/400);
  }
  if(!S.boss && S.enHP<S.enMax*S.st.bossAt){S.boss=true;const B=S.st.boss==='BOSS2'?BOSS2:BOSS;spawn(B,-1);S.shake=0.8;beep(60,0.8,'sawtooth',0.1);
    S.fx.push({type:'text',x:W/2,y:260,s:B.beam?'외눈 대마왕 등장!!!':'보스 등장!!',t:0,col:B.beam?'#c084fc':'#ff4d4d',big:true});}

  for(const u of S.units){
    if(u.dead){u.dead+=dt; u.x-=u.side*u.kb*dt; u.kb*=0.95; continue;}
    u.phase+=dt*8; u.flash=Math.max(0,u.flash-dt); u.lunge=Math.max(0,u.lunge-dt*4);
    if(u.def.beam){u.beamT=(u.beamT===undefined?4:u.beamT)-dt; if(u.beamT<=0){u.beamT=7; S.shake=0.6; beep(70,0.6,'sawtooth',0.1);
      S.fx.push({type:'wink',x:u.x,y:GROUND-u.h*0.75,t:0}); S.fx.push({type:'text',x:W/2,y:300,s:'윙크 빔!!',t:0,col:'#c084fc',big:true});
      for(const o of S.units) if(o.side>0&&!o.dead&&u.x-o.x<900) dmg(o,140); }}
    if(u.kb>0){u.x-=u.side*u.kb*dt*3; u.kb=Math.max(0,u.kb-600*dt); continue;}
    const d=u.def, front=u.x+u.side*u.w*0.3;
    // 사거리 안의 적 찾기
    let targets=[], best=null, bd=1e9;
    for(const o of S.units){ if(o.side===u.side||o.dead)continue;
      const dist=(o.x-front)*u.side; if(dist<-o.w*0.4)continue;
      if(dist<=d.range+o.w*0.3){targets.push(o); if(dist<bd){bd=dist;best=o;}}}
    const castleX=u.side>0?ENEMY_X-80:OUR_X+80, castleDist=(castleX-front)*u.side;
    const hitCastle = !best && castleDist<=d.range;
    if(best||hitCastle){
      u.atkT-=dt;
      const boost=u.side>0&&S.powered?2:1;
      if(u.atkT<=0){u.atkT=d.rate/boost; u.lunge=1;
        const a=d.atk*(u.side<0?S.st.power:boost);
        if(d.range>200){const tx=best?best.x:castleX, ty=best?GROUND+best.z-best.h/2:GROUND-150; S.fx.push({type:'shot',x0:u.x,y0:GROUND+u.z-u.h*0.6,x1:tx,y1:ty,t:0,poop:d.poop,side:u.side});}
        if(best){ if(d.area) targets.forEach(o=>dmg(o,a)); else dmg(best,a);
          if(d.area){S.fx.push({type:'boom',x:best.x,y:GROUND+best.z-40,t:0});}
          beep(u.side>0?300:200,0.05,'square',0.03);}
        else { if(u.side>0)S.enHP-=a; else S.ourHP-=a; S.shake=0.15;
          S.fx.push({type:'boom',x:castleX,y:GROUND-150,t:0}); beep(120,0.1,'sawtooth',0.04);}
      }
    } else u.x+=u.side*d.speed*dt*(u.side>0&&S.powered?2:1);
  }
  S.units=S.units.filter(u=>!(u.dead>0.9));
  for(const f of S.fx){f.t+=dt; if(f.type==='star'){f.x+=f.vx*dt;f.y+=f.vy*dt;f.vy+=1200*dt;}}
  S.fx=S.fx.filter(f=>f.t<(f.type==='text'?(f.big?2:0.8):f.type==='beam'?0.6:f.type==='wink'?0.7:f.type==='shot'?0.35:0.5));

  if(S.enHP<=0){screen='win';S.enHP=0; const was=allClear(); if(!CLEAR.includes(stageIdx)){CLEAR.push(stageIdx);saveClear();} S.toEnding=!was&&allClear();beep(523,0.2,'triangle');setTimeout(()=>beep(659,0.2,'triangle'),200);setTimeout(()=>beep(784,0.4,'triangle'),400);}
  if(S.ourHP<=0){screen='lose';loseSel=0;S.ourHP=0;beep(200,0.5,'sawtooth',0.06);}
}

function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

function drawUnit(u){
  const im=IMG[u.def.id]; let y=GROUND+u.z;
  const bob=u.dead?0:Math.abs(Math.sin(u.phase))*10, tilt=u.dead?u.side*-u.dead*3:Math.sin(u.phase)*0.06;
  const lx=u.lunge*u.side*25;
  const fy=u.def.fly? -110-Math.sin(u.phase*0.5)*15 : 0;
  ctx.save();
  ctx.globalAlpha=u.dead?Math.max(0,1-u.dead*1.2):1;
  ctx.fillStyle=u.side>0?'rgba(40,90,255,0.35)':'rgba(255,40,60,0.4)';ctx.beginPath();ctx.ellipse(u.x,y+4,u.w*0.38,12,0,0,7);ctx.fill();
  ctx.translate(u.x+lx,y-bob+fy-(u.dead?u.dead*200:0));ctx.rotate(tilt);
  if(u.side>0&&S.powered&&!u.dead){const t=performance.now()/1000;
    ctx.save();
    for(let i=0;i<7;i++){const k=i/6, fx=(k-0.5)*u.w*0.9, fl=0.75+0.35*Math.sin(t*14+i*1.7+u.phase);
      const hh=u.h*(0.55+0.35*Math.sin(k*Math.PI))*fl;

      ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(fx-u.w*0.16,0);ctx.quadraticCurveTo(fx-u.w*0.2,-hh*0.6,fx+Math.sin(t*9+i)*12,-hh-u.h*0.4);ctx.quadraticCurveTo(fx+u.w*0.2,-hh*0.6,fx+u.w*0.16,0);ctx.fill();}
    for(let i=0;i<5;i++){const p=((t*0.9+i/5+u.phase*0.1)%1);ctx.fillStyle=`rgba(255,${150+i*20},40,${1-p})`;
      ctx.beginPath();ctx.arc(Math.sin(i*2.3+t*3)*u.w*0.4,-p*u.h*1.3,6*(1-p)+2,0,7);ctx.fill();}
    ctx.restore();}
  const src=u.flash>0?(u.side>0?im.hit:im.hitE):(u.side>0?im.hero:im.enemy);

  const days=[...new Set(ws.map(w=>w.day))].sort().reverse();
  let sum=0; const acc=ws.map(w=>{const r=days.indexOf(w.day); let wt=r===0?6:r===1?3:1;
    const st=STATS[w.w]||{c:0,w:0,r:0}; wt*=(1+st.w*0.7)*Math.max(0.05,Math.pow(0.5,st.r||0));
    if(recent.includes(w.w))wt*=0.02; return sum+=wt;});

}

  stopMusic();
  const N={C4:262,D4:294,E4:330,F4:349,G4:392,A4:440,B4:494,C5:523,D5:587,E5:659,F5:698,G5:784,A5:880,C6:1047,G3:196,C3:131,F3:175,A3:220,E3:165};
  const mel=[['G4',1],['C5',1],['E5',1],['G5',2],['E5',1],['G5',3],
             ['A4',1],['C5',1],['F5',1],['A5',2],['F5',1],['A5',3],
             ['G5',1],['F5',1],['E5',1],['D5',1],['E5',1],['C5',1],['D5',2],['G4',2],
             ['C5',1],['E5',1],['G5',1],['C6',4],[null,1]];
  const bass=['C3','C3','F3','F3','G3','G3','C3','C3'];
  const beat=0.2; let total=0;
  for(let rep=0;rep<3;rep++){
    let t=total; for(const [n,d] of mel){ if(n) musicTimers.push(setTimeout(()=>beep(N[n],beat*d*0.95,'triangle',0.07),t*1000)); t+=beat*d; }
    let bt=total; for(let i=0;i<bass.length;i++){ for(let j=0;j<4;j++){const f=N[bass[i]]; musicTimers.push(setTimeout(()=>beep(f,beat*0.9,'square',0.025),(bt+j*beat)*1000));} bt+=beat*4; }
    total=t;
  }
}
function startEnding(){
  const ws=words(); const learned=ws.filter(w=>(STATS[w.w]||{}).c>0).length;
  END={t:0,learned,total:ws.length,fw:0}; screen='ending'; CFX=[]; banner=null; playMusic();
}
const ease=t=>t<0?0:t>1?1:1-Math.pow(1-t,3);
function drawEnding(dt){
  const t=(END.t+=dt), cx=W/2;
  // 배경: 밤 → 새벽 → 금빛
  const k=Math.min(1,Math.max(0,(t-3)/4));
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,`rgb(${20+k*40|0},${12+k*60|0},${45+k*120|0})`);g.addColorStop(1,`rgb(${30+k*225|0},${20+k*150|0},${60+k*30|0})`);
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // 회전하는 빛줄기
  if(t>3){ctx.save();ctx.translate(cx,H*0.42);ctx.rotate(t*0.15);ctx.globalAlpha=Math.min(0.25,(t-3)*0.08);
    for(let i=0;i<16;i++){ctx.rotate(Math.PI/8);ctx.fillStyle=i%2?'#fff6c0':'#ffd23f';ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(-90,-1400);ctx.lineTo(90,-1400);ctx.fill();}
    ctx.restore();}
  // 별
  ctx.fillStyle='#fff';for(let i=0;i<70;i++){const a=0.4+0.6*Math.abs(Math.sin(t*2+i));ctx.globalAlpha=a*(1-k*0.7);ctx.fillRect((i*137)%W,(i*71)%(H*0.6),3,3);}ctx.globalAlpha=1;
  ctx.fillStyle=`rgba(60,140,60,${0.4+k*0.6})`;ctx.fillRect(0,H-150,W,150);

  // 장면 1: 대마왕의 성이 무너진다 (0~4초)
  if(t<4.5){const sh=t>1&&t<3.5?(Math.random()-.5)*30:0, sink=ease((t-1.2)/2.3)*420;
    ctx.save();ctx.translate(cx+sh,0);ctx.beginPath();ctx.rect(-400,0,800,H-150);ctx.clip();
    ctx.fillStyle='#4a2537';ctx.fillRect(-150,H-150-420+sink,300,420);for(let i=0;i<4;i++)ctx.fillRect(-150+i*85,H-150-480+sink,45,60);
    ctx.fillStyle='#ff4d4d';ctx.beginPath();ctx.moveTo(0,H-150-560+sink);ctx.lineTo(-90,H-150-530+sink);ctx.lineTo(0,H-150-500+sink);ctx.fill();
    ctx.restore();
    if(t>1&&t<3.5&&Math.random()<0.5)CFX.push({k:'c',x:cx+(Math.random()-.5)*300,y:H-300,vx:(Math.random()-.5)*900,vy:-400-Math.random()*600,r:0,vr:5,s:26,c:'#6b3a4f',t:0,life:1.5});
    ctx.globalAlpha=Math.min(1,t/0.8)*(t>3.6?Math.max(0,1-(t-3.6)/0.8):1);
    txt('대마왕의 성이 무너진다…!',cx,170,80,'#fff');ctx.globalAlpha=1;
    if(t>1&&t<3.5&&((t*10)|0)%3===0)beep(60+Math.random()*40,0.08,'sawtooth',0.03);
  }
  // 장면 2: 축하 타이틀 (4~)
  if(t>4){const z=ease((t-4)/0.8), pul=1+Math.sin(t*4)*0.03;
    ctx.save();ctx.translate(cx,170);ctx.scale(z*pul,z*pul);
    txt('축하합니다!!',0,0,150,`hsl(${(t*90)%360},95%,62%)`);ctx.restore();
    if(t>4.6){ctx.globalAlpha=ease((t-4.6)/0.6);txt(`${ACCOUNTS[acct].name}, 모든 단계를 클리어했어요!`,cx,300,58,'#fff');ctx.globalAlpha=1;}
    // 불꽃놀이
    END.fw-=dt; if(END.fw<=0){END.fw=t<20?0.35:0.6; rocket(0);}
    if(t>4&&t<4.1&&!END.c1){END.c1=1;confetti(250);flashT=0.5;}
  }
  // 장면 3: 영웅 퍼레이드 (6~17초) — 아군이 불꽃을 두르고 행진
  if(t>6&&t<18){const p=(t-6);
    HEROES.forEach((d,i)=>{const im=IMG[d.id],h=190,w=h*im.w/im.h; const x=-200+p*260-i*230; if(x<-250||x>W+250)return;
      const y=H-110-Math.abs(Math.sin(p*7+i))*70;
      ctx.save();ctx.translate(x,y);ctx.rotate(Math.sin(p*7+i)*0.15);
      for(let f=0;f<5;f++){const fx=(f/4-0.5)*w*0.9,hh=h*(0.6+0.3*Math.sin(t*14+f+i));const gg=ctx.createLinearGradient(0,0,0,-hh-60);
        gg.addColorStop(0,'rgba(255,60,0,0.7)');gg.addColorStop(1,'rgba(255,220,0,0)');ctx.fillStyle=gg;ctx.beginPath();ctx.moveTo(fx-w*0.15,0);ctx.quadraticCurveTo(fx,-hh*0.6,fx,-hh-60);ctx.quadraticCurveTo(fx,-hh*0.6,fx+w*0.15,0);ctx.fill();}
      ctx.drawImage(im.hero,-w/2,-h,w,h);ctx.restore();
      txt(d.name,x,y+30,30,'#fff');});
    txt('🎉 우리 영웅들의 승리 퍼레이드! 🎉',cx,420,52,'#ffd23f');
  }
  // 장면 4: 쓰러진 악당들이 별이 되어 사라짐 (17~23초)
  if(t>17&&t<23.5){const bad=[...ENEMIES.slice(-5),BOSS,BOSS2];
    bad.forEach((d,i)=>{const im=IMG[d.id],h=d.boss?260:170,w=h*im.w/im.h;const st=17+i*0.6, q=(t-st);
      if(q<0)return; const x=cx+(i-(bad.length-1)/2)*240, pop=q>2.2;
      if(!pop){ctx.save();ctx.translate(x,H-130);ctx.rotate(Math.sin(q*20)*0.2*Math.min(1,q));const sc=1-Math.max(0,q-1.5)/0.7*0.9;ctx.scale(sc,sc);ctx.drawImage(im.enemy,-w/2,-h,w,h);ctx.restore();}
      else if(!END['p'+i]){END['p'+i]=1;beep(1200+i*100,0.1,'triangle',0.05);for(let j=0;j<30;j++){const a=j/30*6.283;CFX.push({k:'p',x,y:H-200,vx:Math.cos(a)*350,vy:Math.sin(a)*350,c:'#ffd23f',t:0,life:1.2});}}});
    txt('악당들은 반짝이는 별이 되었습니다 ✨',cx,420,52,'#fff');
  }
  // 장면 5: 트로피와 명예의 전당 (23초~)
  if(t>23){const q=t-23, ty=ease(q/1.2);
    ctx.save();ctx.translate(cx,-300+ty*780);const s2=1+Math.sin(t*3)*0.04;ctx.scale(s2,s2);
    ctx.fillStyle='#f59e0b';ctx.fillRect(-90,140,180,40);ctx.fillRect(-30,60,60,90);
    ctx.fillStyle='#fbbf24';ctx.beginPath();ctx.moveTo(-140,-140);ctx.lineTo(140,-140);ctx.quadraticCurveTo(130,70,0,80);ctx.quadraticCurveTo(-130,70,-140,-140);ctx.fill();
    ctx.strokeStyle='#fbbf24';ctx.lineWidth=22;ctx.beginPath();ctx.arc(-150,-60,55,Math.PI*0.5,Math.PI*1.5);ctx.stroke();ctx.beginPath();ctx.arc(150,-60,55,-Math.PI*0.5,Math.PI*0.5);ctx.stroke();
    ctx.fillStyle='#fff8';ctx.beginPath();ctx.ellipse(-60,-70,18,60,0.2,0,7);ctx.fill();
    txt('1',0,-40,110,'#b45309','center',null);ctx.restore();
    if(q>1.3){ctx.globalAlpha=ease((q-1.3)/0.6);
      ctx.fillStyle='#0008';rr(cx-560,700,1120,250,30);ctx.fill();
      txt(`🏅 ${ACCOUNTS[acct].name} · 영어 영웅 🏅`,cx,750,54,'#ffd23f');
      txt(`맞혀 본 단어 ${END.learned} / ${END.total}개   ·   최고 연속 정답 ${best}개`,cx,830,40,'#fff');
      txt('그림: 유찬 · 채민      THE END',cx,900,36,'#fffc');ctx.globalAlpha=1;}
    if(q>1.2&&!END.c2){END.c2=1;confetti(300);flashT=0.4;fanfare(12);}
    // 양옆에서 응원하는 아군
    HEROES.slice(0,6).forEach((d,i)=>{const im=IMG[d.id],h=150,w=h*im.w/im.h,side=i%2?1:-1,x=cx+side*(700+(i>>1)*120),y=H-60-Math.abs(Math.sin(t*8+i))*50;ctx.drawImage(im.hero,x-w/2,y-h,w,h);});
  }
  if(t>3)txt(t>23?'OK → 처음 화면':'OK → 건너뛰기',W-170,H-40,28,'#fff9');
  if(t>40){screen='title';stopMusic();}
}

/* ===== 입력: 리모컨/키보드 + 터치/마우스 ===== */
function press(k){
  if(!AC) beep(1,0.01,'sine',0.0001);
  if(screen==='account'){
    if(k==='left'||k==='right')acct=1-acct;
    else if(k==='ok')pickAcct();
    else if(typeof k==='number'&&k<2){acct=k;pickAcct();}
    return;
  }
  if(screen==='title'){
    if(k==='up'||k==='down'){trow=1-trow; tcol=Math.min(tcol,titleBtns().length-1);}
    else if(k==='left'||k==='right'){const n=titleBtns().length; if(trow===0)stageIdx=(stageIdx+(k==='left'?STAGES.length-1:1))%STAGES.length; else tcol=(tcol+(k==='left'?n-1:1))%n; }
    else if(k==='ok'){ if(trow===0){newGame();streak=0;screen='play';} else if(tcol===0)startPractice(); else if(tcol===1)screen='account'; else startEnding(); }
    return;
  }
  if(screen==='quiz'||screen==='practice'){quizKey(k);return;}
  if(screen==='practiceEnd'){ if(k==='ok')screen='title'; return; }
  if(screen==='lose'&&!S.revived&&words().length){
    if(k==='left'||k==='right')loseSel=1-loseSel;
    else if(k==='ok'){ if(loseSel===0)startRevive(); else{S.revived=true;screen='title';} }
    return; }
  if(screen==='ending'){ if(k==='ok'&&END.t>3){screen='title';stopMusic();} return; }
  if(screen==='win'&&S.toEnding&&k==='ok'){startEnding();return;}
  if(screen==='win'||screen==='lose'){ if(k==='ok'){ if(screen==='win'&&stageIdx<STAGES.length-1)stageIdx++; screen='title';} return; }
  if(screen==='pause'){ if(k==='ok'||k==='pause')screen='play'; return; }
  if(k==='left')sel=(sel+HEROES.length-1)%HEROES.length;
  else if(k==='right')sel=(sel+1)%HEROES.length;
  else if(k==='ok')heroSpawn(sel);
  else if(k==='up')upgradeWallet();
  else if(k==='down')fireCannon();
  else if(k==='pause')screen='pause';
  else if(typeof k==='number'){sel=k;heroSpawn(k);}
}
addEventListener('keydown',e=>{
  const c=e.keyCode; let k=null;
  if(c===37)k='left';else if(c===39)k='right';else if(c===38)k='up';else if(c===40)k='down';
  else if(c===13||c===32)k='ok';else if(c===19||c===80||c===415||c===10252)k='pause';
  else if(c>=48&&c<=57)k=(c-48+9)%10; else if(c>=96&&c<=105)k=(c-96+9)%10;
  if(k!==null){e.preventDefault();press(k);}
});
cv.addEventListener('pointerdown',e=>{
  const r=cv.getBoundingClientRect(), x=(e.clientX-r.left)*W/r.width, y=(e.clientY-r.top)*H/r.height;
  if(screen==='ending'){press('ok');return;}
  if(screen==='account'){acct=x<W/2?0:1;pickAcct();return;}
  if(screen==='title'){
    if(y>590&&y<690){const i=Math.round((x-W/2)/440+1.5); if(i>=0&&i<STAGES.length){trow=0; if(i===stageIdx)press('ok'); else stageIdx=i;}}
    else if(y>740&&y<840){const n=titleBtns().length,sp=n>2?500:560;const i=Math.max(0,Math.min(n-1,Math.round((x-W/2)/sp+(n-1)/2))); trow=1; if(tcol===i)press('ok'); else tcol=i;}
    return;}
  if(screen==='quiz'||screen==='practice'){
    if(QZ.done){quizKey('ok');return;}
    for(let i=0;i<QZ.opts.length;i++){const [rx,ry,rw,rh]=optRect(i); if(x>=rx&&x<=rx+rw&&y>=ry&&y<=ry+rh){answer(i);return;}}
    return;}
  if(screen==='lose'&&!S.revived&&words().length&&y>H/2+50&&y<H/2+190){loseSel=x<W/2?0:1;press('ok');return;}
  if(screen!=='play'){press('ok');return;}
  if(y>CARD_Y-6){for(let i=0;i<HEROES.length;i++){const cx=cardX(i);if(x>=cx&&x<=cx+CARD_W){press(i);return;}}}
  if(y<100&&x>560&&x<890)press('up');
  if(y<100&&x>W-430)press('down');
});

/* ===== 메인 루프 ===== */
let last=0, fps=60;
function loop(ts){
  const dt=Math.min(0.05,(ts-last)/1000||0);last=ts; fps=fps*0.95+(dt>0?1/dt:60)*0.05;
  if(screen==='account'){drawAccount(dt);}
  else if(screen==='title'){drawTitle(dt);}
  else if(screen==='ending'){drawEnding(dt);}
  else if(screen==='practice'||screen==='practiceEnd'){titleT+=dt;drawBG(STAGES[stageIdx],titleT); if(screen==='practice')drawQuiz(dt); else drawPracticeEnd();}
  else{
    if(screen==='play')update(dt);
    ctx.save(); if(S.shake>0)ctx.translate((Math.random()-.5)*20*S.shake*3,(Math.random()-.5)*20*S.shake*3);
    drawBG(S.st,S.t); castle(OUR_X,S.ourHP,S.ourMax,true); castle(ENEMY_X,S.enHP,S.enMax,false);
    [...S.units].sort((a,b)=>a.z-b.z).forEach(drawUnit); drawFX(); ctx.restore();
    drawHUD();
    if(screen==='win')overlay(S.toEnding?'모든 단계 클리어!!':'승리!!',S.toEnding?'OK 버튼 → 🎬 축하 영상 보기':'OK 버튼 → 다음 단계','#ffd23f');
    if(screen==='lose'){
      if(S.revived||!words().length) overlay(S.revived&&REV?'부활 실패…':'으앙 졌다…','OK 버튼 → 처음 화면','#ff6b6b');
      else{ctx.fillStyle='#000a';ctx.fillRect(0,0,W,H);txt('으앙 졌다…',W/2,H/2-200,130,'#ff6b6b');
        txt('어려운 단어 3개를 모두 맞히면 부활! 아군 파워 2배!',W/2,H/2-60,46,'#ffd23f');
        [['🔥 부활 도전!','#f97316'],['포기하기','#555']].forEach(([t,c],i)=>{const x=W/2+(i-0.5)*560,y=H/2+120,on=loseSel===i;
          if(on){ctx.fillStyle='#fff';rr(x-245,y-65,490,130,34);ctx.fill();}
          ctx.fillStyle=c;rr(x-235,y-55,470,110,28);ctx.fill();txt(t,x,y,52,'#fff');});
        txt('◀ ▶ 고르고 OK',W/2,H/2+260,40,'#fff');}
    }
    if(screen==='pause')overlay('잠깐 멈춤','OK 버튼 → 계속','#fff');
    if(screen==='quiz')drawQuiz(dt);
  }
  updFX(dt); drawFXTop();
  if(location.hash==='#fps')txt(Math.round(fps)+' fps',W-90,140,30,'#0f0','center');
  requestAnimationFrame(loop);
}
const ids=new Set([...HEROES,...ENEMIES,BOSS,BOSS2].map(d=>d.id));
Promise.all([...ids].map(prep)).then(()=>requestAnimationFrame(loop));
</script>
