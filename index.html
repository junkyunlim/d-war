/* ===== 이미지 준비 (아군: 원본 / 적군: 좌우반전 + 붉은 빛) ===== */
const IMG={};
function prep(id){
  return new Promise(res=>{
    const im=new Image();
    im.onload=()=>{
      const mk=(flip,tint)=>{const c=document.createElement('canvas');c.width=im.width;c.height=im.height;const x=c.getContext('2d');
        if(flip){x.translate(im.width,0);x.scale(-1,1);} x.drawImage(im,0,0);
        if(tint){x.setTransform(1,0,0,1,0,0);x.globalCompositeOperation='source-atop';x.fillStyle=tint;x.fillRect(0,0,c.width,c.height);}
        return c;};
      IMG[id]={hero:mk(false,null), enemy:mk(true,'rgba(220,30,60,0.38)'), hit:mk(false,'rgba(255,255,255,0.5)'), hitE:mk(true,'rgba(255,220,220,0.5)'), w:im.width, h:im.height};
      res();
    };
    im.src=SPR[id];
  });
}

/* ===== 효과음 (WebAudio) ===== */
let AC=null;
function beep(f=440,d=0.08,type='square',v=0.05){
  try{ if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;
    g.gain.setValueAtTime(v,AC.currentTime);g.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+d);
    o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d);}catch(e){}
}

let S;
const STAGES=[
  {name:'1단계 · 동네 공터', castle:2500, spawn:4.5, power:1.0, bossAt:0.5, bg:['#8fd3ff','#d8f1ff'], ground:'#7cc56a'},

];
let stageIdx=0, screen='title', sel=0;

function newGame(){
  const st=STAGES[stageIdx];
  S={t:0, money:0, wallet:1, units:[], fx:[], cd:HEROES.map(()=>0),
     ourHP:3000, ourMax:3000, enHP:st.castle, enMax:st.castle,
     spawnT:2, boss:false, st, shake:0, cannon:0};
}
const walletMax=l=>[0,500,1000,1600,2400,3400,4600,6000,8000][l];
const walletRate=l=>[0,30,45,60,80,100,125,150,180][l];
const walletCost=l=>[0,160,320,480,640,800,960,1120,9e9][l];

function spawn(def,side){
  const im=IMG[def.id]; const h=def.h; const w=h*im.w/im.h;
  S.units.push({def,side,x: side>0? OUR_X+60 : ENEMY_X-60, z:Math.random()*40-10, w,h,
    hp:def.hp*(side<0?S.st.power:1), max:def.hp*(side<0?S.st.power:1),
    atkT:0.3, phase:Math.random()*6, lunge:0, flash:0, kb:0, dead:0});
}

function heroSpawn(i){
  const d=HEROES[i];
  if(S.cd[i]>0||S.money<d.cost){beep(140,0.12,'sawtooth',0.03);return;}
  S.money-=d.cost; S.cd[i]=d.cd; spawn(d,1); beep(660,0.08); beep(990,0.06,'triangle');
}
function upgradeWallet(){
  const c=walletCost(S.wallet);
  if(S.money<c){beep(140,0.12,'sawtooth',0.03);return;}
  S.money-=c; S.wallet++; beep(523,0.1,'triangle');beep(784,0.15,'triangle');
  S.fx.push({type:'text',x:W/2,y:200,s:'지갑 레벨 UP!',t:0,col:'#ffd23f'});
}
function fireCannon(){
  if(S.cannon<1)return;
  S.cannon=0; S.shake=0.4; beep(80,0.5,'sawtooth',0.08);
  S.fx.push({type:'beam',t:0});
  for(const u of S.units) if(u.side<0&&!u.dead){ dmg(u,250*S.st.power*0.6+100); u.kb=180; }
}

function dmg(u,a){
  u.hp-=a; u.flash=0.12;
  S.fx.push({type:'text',x:u.x,y:GROUND-u.h+u.z-10,s:Math.round(a),t:0,col:u.side>0?'#ff6b6b':'#ffffff',small:true});
  if(u.hp<=0&&!u.dead){u.dead=0.001; u.kb=200;
    if(u.side<0){S.money=Math.min(walletMax(S.wallet),S.money+u.def.money); beep(880,0.05,'triangle');}
    for(let k=0;k<8;k++)S.fx.push({type:'star',x:u.x,y:GROUND-u.h/2+u.z,vx:(Math.random()-.5)*500,vy:-Math.random()*500,t:0});
  } else if(a>u.max*0.2) u.kb=90;
}

/* ===== 업데이트 ===== */
function update(dt){
  S.t+=dt;
  S.money=Math.min(walletMax(S.wallet),S.money+walletRate(S.wallet)*dt);
  S.cd=S.cd.map(c=>Math.max(0,c-dt));
  S.cannon=Math.min(1,S.cannon+dt/40);
  S.shake=Math.max(0,S.shake-dt);

  // 적 생산
  S.spawnT-=dt;
  if(S.spawnT<=0){
    const tier=Math.min(ENEMIES.length, 2+Math.floor(S.t/25));
    const d=ENEMIES[Math.floor(Math.random()*tier)];
    spawn(d,-1);
    S.spawnT=S.st.spawn*(0.6+Math.random()*0.8)*Math.max(0.55,1-S.t/400);
  }
  if(!S.boss && S.enHP<S.enMax*S.st.bossAt){S.boss=true;spawn(BOSS,-1);S.shake=0.6;beep(60,0.8,'sawtooth',0.1);
    S.fx.push({type:'text',x:W/2,y:260,s:'보스 등장!!',t:0,col:'#ff4d4d',big:true});}

  for(const u of S.units){
    if(u.dead){u.dead+=dt; u.x-=u.side*u.kb*dt; u.kb*=0.95; continue;}
    u.phase+=dt*8; u.flash=Math.max(0,u.flash-dt); u.lunge=Math.max(0,u.lunge-dt*4);
    if(u.kb>0){u.x-=u.side*u.kb*dt*3; u.kb=Math.max(0,u.kb-600*dt); continue;}
    const d=u.def, front=u.x+u.side*u.w*0.3;
    // 사거리 안의 적 찾기
    let targets=[], best=null, bd=1e9;
    for(const o of S.units){ if(o.side===u.side||o.dead)continue;
      const dist=(o.x-front)*u.side; if(dist<-o.w*0.4)continue;
      if(dist<=d.range+o.w*0.3){targets.push(o); if(dist<bd){bd=dist;best=o;}}}
    const castleX=u.side>0?ENEMY_X-80:OUR_X+80, castleDist=(castleX-front)*u.side;
    const hitCastle = !best && castleDist<=d.range;
    if(best||hitCastle){
      u.atkT-=dt;
      if(u.atkT<=0){u.atkT=d.rate; u.lunge=1;
        const a=d.atk*(u.side<0?S.st.power:1);
        if(best){ if(d.area) targets.forEach(o=>dmg(o,a)); else dmg(best,a);
          if(d.area){S.fx.push({type:'boom',x:best.x,y:GROUND+best.z-40,t:0});}
          beep(u.side>0?300:200,0.05,'square',0.03);}
        else { if(u.side>0)S.enHP-=a; else S.ourHP-=a; S.shake=0.15;
          S.fx.push({type:'boom',x:castleX,y:GROUND-150,t:0}); beep(120,0.1,'sawtooth',0.04);}
      }
    } else u.x+=u.side*d.speed*dt;
  }
  S.units=S.units.filter(u=>!(u.dead>0.9));
  for(const f of S.fx){f.t+=dt; if(f.type==='star'){f.x+=f.vx*dt;f.y+=f.vy*dt;f.vy+=1200*dt;}}
  S.fx=S.fx.filter(f=>f.t<(f.type==='text'?(f.big?2:0.8):f.type==='beam'?0.6:0.5));

  if(S.enHP<=0){screen='win';S.enHP=0;beep(523,0.2,'triangle');setTimeout(()=>beep(659,0.2,'triangle'),200);setTimeout(()=>beep(784,0.4,'triangle'),400);}
  if(S.ourHP<=0){screen='lose';S.ourHP=0;beep(200,0.5,'sawtooth',0.06);}
}

/* ===== 그리기 ===== */
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function txt(s,x,y,size,col='#fff',align='center',stroke='#000'){
  ctx.font=`900 ${size}px "Samsung One Korean","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif`;
  ctx.textAlign=align;ctx.textBaseline='middle';ctx.lineJoin='round';
  if(stroke){ctx.lineWidth=size/6;ctx.strokeStyle=stroke;ctx.strokeText(s,x,y);}
  ctx.fillStyle=col;ctx.fillText(s,x,y);
}
function drawBG(st,t){
  const g=ctx.createLinearGradient(0,0,0,GROUND);g.addColorStop(0,st.bg[0]);g.addColorStop(1,st.bg[1]);
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(255,255,255,0.85)';
  for(let i=0;i<5;i++){const x=((i*430+t*15)%(W+300))-150,y=90+i*37%120;
    ctx.beginPath();ctx.arc(x,y,40,0,7);ctx.arc(x+45,y-15,50,0,7);ctx.arc(x+95,y,38,0,7);ctx.fill();}
  ctx.fillStyle=st.ground;ctx.fillRect(0,GROUND-20,W,H-GROUND+20);
  ctx.fillStyle='rgba(0,0,0,0.08)';for(let x=0;x<W;x+=60)ctx.fillRect(x,GROUND+10+((x/60)%3)*15,30,6);
}
function castle(x,hp,max,our){
  const c1=our?'#5b8def':'#6b3a4f', c2=our?'#3d6bc4':'#4a2537';
  ctx.fillStyle=c2;ctx.fillRect(x-90,GROUND-300,180,300);
  ctx.fillStyle=c1;ctx.fillRect(x-80,GROUND-290,160,290);
  for(let i=0;i<4;i++){ctx.fillStyle=c2;ctx.fillRect(x-90+i*50,GROUND-340,30,45);}
  ctx.fillStyle='#2a1a10';rr(x-35,GROUND-110,70,110,30);ctx.fill();
  ctx.fillStyle='#fff8';ctx.fillRect(x-50,GROUND-230,30,40);ctx.fillRect(x+20,GROUND-230,30,40);
  ctx.strokeStyle='#333';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(x,GROUND-340);ctx.lineTo(x,GROUND-430);ctx.stroke();
  ctx.fillStyle=our?'#ffd23f':'#ff4d4d';ctx.beginPath();ctx.moveTo(x,GROUND-430);ctx.lineTo(x+(our?70:-70),GROUND-405);ctx.lineTo(x,GROUND-380);ctx.fill();
  const bw=220;ctx.fillStyle='#0008';rr(x-bw/2,GROUND-480,bw,30,10);ctx.fill();
  ctx.fillStyle=our?'#4ade80':'#f87171';rr(x-bw/2+4,GROUND-476,(bw-8)*Math.max(0,hp/max),22,8);ctx.fill();
  txt(`${Math.ceil(hp)} / ${max}`,x,GROUND-465,22,'#fff');
}
function drawUnit(u){
  const im=IMG[u.def.id]; let y=GROUND+u.z;
  const bob=u.dead?0:Math.abs(Math.sin(u.phase))*10, tilt=u.dead?u.side*-u.dead*3:Math.sin(u.phase)*0.06;
  const lx=u.lunge*u.side*25;
  const fy=u.def.fly? -110-Math.sin(u.phase*0.5)*15 : 0;
  ctx.save();
  ctx.globalAlpha=u.dead?Math.max(0,1-u.dead*1.2):1;
  ctx.fillStyle=u.side>0?'rgba(40,90,255,0.35)':'rgba(255,40,60,0.4)';ctx.beginPath();ctx.ellipse(u.x,y+4,u.w*0.38,12,0,0,7);ctx.fill();
  ctx.translate(u.x+lx,y-bob+fy-(u.dead?u.dead*200:0));ctx.rotate(tilt);
  const src=u.flash>0?(u.side>0?im.hit:im.hitE):(u.side>0?im.hero:im.enemy);
  ctx.drawImage(src,-u.w/2,-u.h,u.w,u.h);
  ctx.restore();
  if(!u.dead && u.hp<u.max){const bw=Math.max(60,u.w*0.6);
    ctx.fillStyle='#0009';ctx.fillRect(u.x-bw/2,y-u.h+fy-18,bw,9);
    ctx.fillStyle=u.side>0?'#4ade80':'#f87171';ctx.fillRect(u.x-bw/2,y-u.h+fy-18,bw*u.hp/u.max,9);}
  if(u.def.boss&&!u.dead)txt('BOSS',u.x,y-u.h+fy-40,34,'#ff4d4d');
}
const CARD_W=172,CARD_H=200,CARD_Y=H-CARD_H-18;
const cardX=i=>W/2-(HEROES.length*CARD_W+(HEROES.length-1)*8)/2+i*(CARD_W+8);
function drawHUD(){
  // 돈
  ctx.fillStyle='#0009';rr(24,20,520,80,20);ctx.fill();
  txt(`💰 ${Math.floor(S.money)} / ${walletMax(S.wallet)}`,44,60,44,'#ffd23f','left');
  // 지갑 업그레이드 (위 버튼)
  const wc=walletCost(S.wallet), canW=S.money>=wc&&S.wallet<8;
  ctx.fillStyle=canW?'#ffb703':'#555c';rr(560,20,330,80,20);ctx.fill();
  txt(S.wallet<8?`▲ 지갑 Lv${S.wallet} (${wc})`:'지갑 MAX',725,60,32,'#fff');
  // 대포 (아래 버튼)
  ctx.fillStyle='#0009';rr(W-430,20,400,80,20);ctx.fill();
  ctx.fillStyle=S.cannon>=1?'#ff5d5d':'#888';rr(W-424,26,388*S.cannon,68,16);ctx.fill();
  txt(S.cannon>=1?'▼ 대포 발사 준비!':'대포 충전 중…',W-230,60,32,'#fff');
  txt(S.st.name,W/2,140,36,'#fff');
  // 카드
  HEROES.forEach((d,i)=>{
    const x=cardX(i),y=CARD_Y, ok=S.money>=d.cost&&S.cd[i]<=0, on=i===sel;
    ctx.fillStyle=on?'#ffd23f':'#00000088';rr(x-6,y-6,CARD_W+12,CARD_H+12,22);ctx.fill();
    ctx.fillStyle=ok?'#fffaf0':'#9a9a9a';rr(x,y,CARD_W,CARD_H,18);ctx.fill();
    const im=IMG[d.id], s=Math.min((CARD_W-20)/im.w,(CARD_H-70)/im.h);
    ctx.globalAlpha=ok?1:0.5;ctx.drawImage(im.hero,x+CARD_W/2-im.w*s/2,y+10,im.w*s,im.h*s);ctx.globalAlpha=1;
    txt(d.name,x+CARD_W/2,y+CARD_H-48,24,'#222','center',null);
    txt(`${d.cost}원`,x+CARD_W/2,y+CARD_H-20,26,ok?'#d97706':'#555','center',null);
    if(S.cd[i]>0){ctx.fillStyle='#0007';rr(x,y,CARD_W,CARD_H*(S.cd[i]/d.cd),18);ctx.fill();}
    txt(String((i+1)%10),x+20,y+22,26,'#fff');
  });
}
function drawFX(){
  for(const f of S.fx){
    if(f.type==='text'){const a=1-f.t/(f.big?2:0.8);ctx.globalAlpha=Math.max(0,a);
      txt(String(f.s),f.x,f.y-f.t*60,f.big?110:(f.small?30:64),f.col);ctx.globalAlpha=1;}
    else if(f.type==='star'){ctx.fillStyle='#ffd23f';ctx.beginPath();ctx.arc(f.x,f.y,9*(1-f.t*2),0,7);ctx.fill();}
    else if(f.type==='boom'){const r=20+f.t*220;ctx.strokeStyle=`rgba(255,180,40,${1-f.t*2})`;ctx.lineWidth=12;ctx.beginPath();ctx.arc(f.x,f.y,r,0,7);ctx.stroke();}
    else if(f.type==='beam'){ctx.fillStyle=`rgba(255,240,120,${0.8-f.t})`;ctx.fillRect(OUR_X,GROUND-200,W,180);}
  }
}
function overlay(title,sub,col){
  ctx.fillStyle='#000a';ctx.fillRect(0,0,W,H);
  txt(title,W/2,H/2-80,140,col);txt(sub,W/2,H/2+70,48,'#fff');
}
let titleT=0;
function drawTitle(dt){
  titleT+=dt; drawBG(STAGES[stageIdx],titleT);
  txt('우리집 그림 대전쟁',W/2,190,130,'#ffd23f');
  txt('형제가 그린 캐릭터로 적의 성을 무너뜨려라!',W/2,310,44,'#fff');
  HEROES.forEach((d,i)=>{const im=IMG[d.id],h=150,w=h*im.w/im.h;
    const x=W/2+(i-4.5)*175, y=560+Math.abs(Math.sin(titleT*4+i))*-20;
    ctx.drawImage(im.hero,x-w/2,y-h,w,h);});
  STAGES.forEach((s,i)=>{const x=W/2+(i-1)*480,y=720,on=i===stageIdx;
    ctx.fillStyle=on?'#ffd23f':'#0008';rr(x-210,y-50,420,100,24);ctx.fill();
    txt(s.name,x,y,38,on?'#222':'#fff','center',on?null:'#000');});
  txt('◀ ▶ 단계 고르기   ·   OK(확인) 버튼으로 시작',W/2,870,44,'#fff');
  txt('게임 중: ◀▶ 캐릭터 고르기 · OK 출동 · ▲ 지갑 업그레이드 · ▼ 대포 · 숫자키 바로 출동',W/2,950,32,'#fffd');
}

/* ===== 입력: 리모컨/키보드 + 터치/마우스 ===== */
function press(k){
  if(!AC) beep(1,0.01,'sine',0.0001);
  if(screen==='title'){
    if(k==='left')stageIdx=(stageIdx+2)%3; else if(k==='right')stageIdx=(stageIdx+1)%3;
    else if(k==='ok'){newGame();screen='play';}
    return;
  }
  if(screen==='win'||screen==='lose'){ if(k==='ok'){ if(screen==='win'&&stageIdx<2)stageIdx++; screen='title';} return; }
  if(screen==='pause'){ if(k==='ok'||k==='pause')screen='play'; return; }
  if(k==='left')sel=(sel+HEROES.length-1)%HEROES.length;
  else if(k==='right')sel=(sel+1)%HEROES.length;
  else if(k==='ok')heroSpawn(sel);
  else if(k==='up')upgradeWallet();
  else if(k==='down')fireCannon();
  else if(k==='pause')screen='pause';
  else if(typeof k==='number'){sel=k;heroSpawn(k);}
}
addEventListener('keydown',e=>{
  const c=e.keyCode; let k=null;
  if(c===37)k='left';else if(c===39)k='right';else if(c===38)k='up';else if(c===40)k='down';
  else if(c===13||c===32)k='ok';else if(c===19||c===80||c===415||c===10252)k='pause';
  else if(c>=48&&c<=57)k=(c-48+9)%10; else if(c>=96&&c<=105)k=(c-96+9)%10;
  if(k!==null){e.preventDefault();press(k);}
});
cv.addEventListener('pointerdown',e=>{
  const r=cv.getBoundingClientRect(), x=(e.clientX-r.left)*W/r.width, y=(e.clientY-r.top)*H/r.height;
  if(screen==='title'){ if(y>670&&y<770){const i=Math.round((x-W/2)/480)+1; if(i>=0&&i<3){ if(i===stageIdx)press('ok'); else stageIdx=i;} } else press('ok'); return;}
  if(screen!=='play'){press('ok');return;}
  if(y>CARD_Y-6){for(let i=0;i<HEROES.length;i++){const cx=cardX(i);if(x>=cx&&x<=cx+CARD_W){press(i);return;}}}
  if(y<100&&x>560&&x<890)press('up');
  if(y<100&&x>W-430)press('down');
});

/* ===== 메인 루프 ===== */
let last=0, fps=60;
function loop(ts){
  const dt=Math.min(0.05,(ts-last)/1000||0);last=ts; fps=fps*0.95+(dt>0?1/dt:60)*0.05;
  if(screen==='title'){drawTitle(dt);}
  else{
    if(screen==='play')update(dt);
    ctx.save(); if(S.shake>0)ctx.translate((Math.random()-.5)*20*S.shake*3,(Math.random()-.5)*20*S.shake*3);
    drawBG(S.st,S.t); castle(OUR_X,S.ourHP,S.ourMax,true); castle(ENEMY_X,S.enHP,S.enMax,false);
    [...S.units].sort((a,b)=>a.z-b.z).forEach(drawUnit); drawFX(); ctx.restore();
    drawHUD();
    if(screen==='win')overlay('승리!!','OK 버튼 → 다음 단계','#ffd23f');
    if(screen==='lose')overlay('으앙 졌다…','OK 버튼 → 다시 도전','#ff6b6b');
    if(screen==='pause')overlay('잠깐 멈춤','OK 버튼 → 계속','#fff');
  }
  if(location.hash==='#fps')txt(Math.round(fps)+' fps',W-90,140,30,'#0f0','center');
  requestAnimationFrame(loop);
}
const ids=new Set([...HEROES,...ENEMIES,BOSS].map(d=>d.id));
Promise.all([...ids].map(prep)).then(()=>requestAnimationFrame(loop));
</script>
